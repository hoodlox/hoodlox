<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Hoodlox intro</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
<style>
  :root { --lime: #a6f25d; --cyan: #3fd6ff; --purple: #8b5cff; --gold: #f3c35a; --red: #ff5a5f; --bg: #0b0f20; --ink: #0d1a05; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: #fff; font-family: Inter, sans-serif; }
  #stage div, #stage img, #stage svg { position: absolute; }
  .scene { position: absolute; inset: 0; display: none; }
  .display { font-family: Anton, sans-serif; text-transform: uppercase; line-height: .9; letter-spacing: .01em; white-space: nowrap; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .grad { background: linear-gradient(100deg, var(--cyan), var(--lime) 70%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sticker { font: 400 44px Anton, sans-serif; text-transform: uppercase; padding: 12px 26px 10px; border-radius: 16px; background: var(--lime); color: var(--ink); box-shadow: 0 8px 0 rgba(0,0,0,.35), 0 24px 50px rgba(0,0,0,.45); white-space: nowrap; }
  .sticker.cyan { background: var(--cyan); color: #04202a; }
  .sticker.gold { background: var(--gold); color: #2a1a00; }
  .sticker.red { background: var(--red); color: #fff; }
  .sticker.dark { background: #141a33; color: #fff; border: 3px solid var(--lime); }
  .chip { font: 700 28px 'JetBrains Mono', monospace; padding: 14px 24px; border-radius: 999px; background: rgba(11,15,32,.88); border: 3px solid var(--lime); color: #fff; white-space: nowrap; display: flex; align-items: center; gap: 14px; }
  .chip i { width: 14px; height: 14px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 6px rgba(166,242,93,.25); position: static; display: inline-block; }
  .frame { border-radius: 26px; overflow: hidden; border: 4px solid rgba(255,255,255,.16); box-shadow: 0 34px 90px rgba(0,0,0,.65), 0 0 0 12px rgba(166,242,93,.07); background: #000; }
  .frame img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .full { left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  .shade { inset: 0; }
  .key { width: 120px; height: 120px; border-radius: 22px; background: linear-gradient(#f4f6ff, #c9cfe6); color: #141a33; font: 400 64px Anton, sans-serif; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 0 #6b7395, 0 26px 40px rgba(0,0,0,.5); }
  .key.wide { width: 300px; font-size: 48px; }
  .key.space { width: 520px; font-size: 44px; }
  .label { font: 800 30px Inter, sans-serif; color: #fff; white-space: nowrap; text-shadow: 0 4px 20px rgba(0,0,0,.6); }
  .label b { color: var(--lime); }
  .eyebrow { font: 700 28px 'JetBrains Mono', monospace; color: var(--lime); letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; }
  .card { border-radius: 30px; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,.55); }
  .card .pt { left: 50%; bottom: -10px; width: 120%; transform: translateX(-50%); }
  .coin { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff6c8, #f7cf4a 35%, #c98a12 75%); box-shadow: inset 0 0 0 5px rgba(150,95,0,.55), 0 6px 14px rgba(0,0,0,.35); }
  .coin::after { content: '$'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 900 28px Inter; color: rgba(120,70,0,.75); }
  .rays { border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.22) 0 10deg, transparent 10deg 24deg); -webkit-mask: radial-gradient(circle, #000 20%, transparent 70%); mask: radial-gradient(circle, #000 20%, transparent 70%); }
  .ring { border-radius: 50%; border: 10px solid var(--lime); }
  .icon { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .panel { border-radius: 30px; background: linear-gradient(160deg, #1a2142, #10142a); border: 3px solid rgba(255,255,255,.09); box-shadow: 0 30px 70px rgba(0,0,0,.5); }
  #cap { left: 0; right: 0; bottom: 44px; display: flex; justify-content: center; pointer-events: none; }
  #cap span.box { position: static; display: inline-block; font: 800 40px Inter, sans-serif; padding: 12px 30px 14px; border-radius: 18px; background: rgba(8,10,22,.82); color: #fff; letter-spacing: -.01em; max-width: 1600px; text-align: center; }
  #cap em { font-style: normal; color: rgba(255,255,255,.45); }
  #cap em.on { color: #fff; }
  #cap em.now { color: var(--lime); }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
const TL = await (await fetch('/video/build/timeline.json')).json();
const S = Object.fromEntries(TL.scenes.map((s) => [s.id, s]));
const stage = document.getElementById('stage');
const cues = [];

// --- helpers ---------------------------------------------------------------------------------------
const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent ?? stage).appendChild(e); return e; };
const box = (el, x, y, w, h) => { el.style.left = `${x}px`; el.style.top = `${y}px`; if (w != null) el.style.width = `${w}px`; if (h != null) el.style.height = `${h}px`; return el; };
const img = (src, cls, parent) => { const e = $('img', cls, parent); e.src = src; return e; };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const E = { out: (p) => 1 - (1 - p) ** 3, inOut: (p) => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2), lin: (p) => p };
const prog = (lt, at, d = 0.5, e = E.out) => e(clamp((lt - at) / d));
const spring = (k) => (k <= 0 ? 0 : 1 - Math.exp(-7 * k) * Math.cos(14 * k));
const tf = (el, { x = 0, y = 0, s = 1, r = 0, o = 1, sx, sy }) => { el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${sx ?? s},${sy ?? s})`; el.style.opacity = o; };
// Springy pop-in from nothing.
const pop = (el, lt, at, { x = 0, y = 0, r = 0, from = 0, out = Infinity } = {}) => {
  const k = lt - at, ko = lt - out;
  const s = k <= 0 ? from : from + (1 - from) * spring(k);
  const o = clamp(k / 0.08) * (ko > 0 ? clamp(1 - ko / 0.25) : 1);
  tf(el, { x, y: y + (ko > 0 ? -40 * E.out(clamp(ko / 0.25)) : 0), s: ko > 0 ? s * (1 - 0.2 * clamp(ko / 0.25)) : s, r, o });
};
// Rubber-stamp slam: big → 1 with a jolt.
const stamp = (el, lt, at, r = 0) => { const k = lt - at; tf(el, { s: k <= 0 ? 2 : 1 + 1.1 * Math.max(0, 1 - k / 0.16) ** 2, r, o: clamp(k / 0.05) }); };
// Slide in from an offset.
const slide = (el, lt, at, dx = 0, dy = 60, d = 0.55) => { const p = prog(lt, at, d); tf(el, { x: dx * (1 - p), y: dy * (1 - p), o: clamp((lt - at) / 0.2) }); };
// Ken Burns: scale + drift over the scene.
const kb = (el, lt, dur, { s0 = 1.12, s1 = 1, x0 = 0, x1 = 0, y0 = 0, y1 = 0 } = {}) => { const p = E.inOut(clamp(lt / dur)); tf(el, { s: lerp(s0, s1, p), x: lerp(x0, x1, p), y: lerp(y0, y1, p) }); };
const svg = (paths, size, color, parent, sw = 2) => { const e = $('div', '', parent, `<svg class="icon" viewBox="0 0 24 24" width="${size}" height="${size}" style="position:static;color:${color};stroke-width:${sw}">${paths}</svg>`); return e; };
const ICON = {
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  eyeoff: '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M10 2h4"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  trophy: '<path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>',
  wallet: '<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>',
  shovel: '<path d="M2 22v-5l5-5 5 5-5 5z"/><path d="M9.5 14.5 16 8"/><path d="m17 2 5 5-.5.5a3.53 3.53 0 0 1-5 0a3.53 3.53 0 0 1 0-5L17 2"/>',
  pickaxe: '<path d="M14.531 12.469 6.619 20.38a1 1 0 1 1-3-3l7.912-7.912"/><path d="M15.686 4.314A12.5 12.5 0 0 0 5.461 2.958 1 1 0 0 0 5.58 4.71a22 22 0 0 1 6.318 3.393"/><path d="M17.7 3.7a1 1 0 0 0-1.4 0l-4.6 4.6a1 1 0 0 0 0 1.4l2.6 2.6a1 1 0 0 0 1.4 0l4.6-4.6a1 1 0 0 0 0-1.4z"/><path d="M19.686 8.314a12.5 12.5 0 0 1 1.356 10.225 1 1 0 0 1-1.751-.119 22 22 0 0 0-3.393-6.319"/>',
  drill: '<path d="M10 18a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a3 3 0 0 1-3-3 1 1 0 0 1 1-1z"/><path d="M13 10H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1z"/><path d="m5 18 1.5-8"/><path d="M14 3.5h3l4 2.5-4 2.5h-3"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  vault: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="4"/><path d="M12 8v1M12 15v1M8 12h1M15 12h1"/>',
  bolt: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
};
const SHOT = (n) => `/video/shots/${n}.png`;
const CHEST = (r, open) => `/scenes/chests/icons/${r}-${open ? 'open' : 'closed'}.png`;
const PORTRAIT = (h) => `/scenes/adventurers/portraits/${h}.png`;
const RAR = [
  { id: 'common', name: 'Common', odds: 55, weight: 1, color: '#b9c0cc' },
  { id: 'uncommon', name: 'Uncommon', odds: 25, weight: 2.5, color: '#6fd68a' },
  { id: 'rare', name: 'Rare', odds: 12, weight: 6, color: '#5aa8ff' },
  { id: 'epic', name: 'Epic', odds: 6, weight: 15, color: '#c77dff' },
  { id: 'legendary', name: 'Legendary', odds: 2, weight: 40, color: '#f3c35a' },
];
const HEROES = [
  ['Knight', 'Knight', 'Vanguard', '#f06a54', 4.7], ['Ranger', 'Ranger', 'Tracker', '#52b04a', 4.5], ['Mage', 'Mage', 'Arcane', '#7c5cff', 4.8],
  ['Rogue', 'Rogue', 'Scout', '#3a8df2', 4.4], ['Barbarian', 'Brute', 'Digger', '#f08a2c', 4.6], ['Rogue_Hooded', 'Shade', 'Stealth', '#7d8590', 4.3],
];

// Seeded randomness so every render of a frame is identical.
const rng = (seed) => () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 2 ** 32);

// Coin fountain: n coins thrown from (x, y); draw(k) with k = seconds since the throw.
function burst(parent, n, x, y, seed, { spread = 1400, up = 1500, size = 1, life = 2.2 } = {}) {
  const r = rng(seed);
  const coins = Array.from({ length: n }, () => {
    const el = box($('div', 'coin', parent), x - 27, y - 27);
    return { el, vx: (r() - 0.5) * spread, vy: -up * (0.55 + 0.6 * r()), spin: (r() - 0.5) * 900, s: size * (0.6 + 0.6 * r()), d: r() * 0.12 };
  });
  return (k) => coins.forEach((c) => {
    const t = k - c.d;
    if (t < 0 || t > life) { c.el.style.opacity = 0; return; }
    tf(c.el, { x: c.vx * t, y: c.vy * t + 1300 * t * t, r: c.spin * t, s: c.s, sx: c.s * Math.abs(Math.cos(t * 7 + c.d * 9)) + 0.15, o: clamp((life - t) / 0.4) });
  });
}
// Sparkle dust drifting up.
function dust(parent, n, seed, color = '#ffffff') {
  const r = rng(seed);
  const ps = Array.from({ length: n }, () => { const el = $('div', '', parent); const sz = 3 + r() * 6; el.style.cssText += `width:${sz}px;height:${sz}px;border-radius:50%;background:${color};box-shadow:0 0 12px ${color}`; return { el, x: r() * 1920, y: r() * 1080, v: 20 + r() * 50, ph: r() * 6 }; });
  return (t) => ps.forEach((p) => { tf(p.el, { x: p.x + Math.sin(t * 0.8 + p.ph) * 30, y: ((p.y - p.v * t) % 1180 + 1180) % 1180 - 50, o: 0.25 + 0.35 * Math.sin(t * 2 + p.ph) ** 2 }); });
}

// --- background, wipes, captions ------------------------------------------------------------------
const bg = $('div', '', stage); bg.style.inset = '0';
bg.innerHTML = '';
const bgGrad = box($('div', '', bg), 0, 0, 1920, 1080);
bgGrad.style.background = 'radial-gradient(1200px 700px at 20% 10%, #1b2552, transparent), radial-gradient(1000px 700px at 90% 100%, #1d1446, transparent), #0b0f20';
const grid = box($('div', '', bg), 0, 0, 1920, 1080);
grid.style.cssText += 'background-image:linear-gradient(rgba(255,255,255,.045) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.045) 2px,transparent 2px);background-size:80px 80px;';
const blobA = box($('div', '', bg), 0, 0, 900, 900), blobB = box($('div', '', bg), 0, 0, 800, 800);
blobA.style.cssText += 'border-radius:50%;background:radial-gradient(circle,rgba(166,242,93,.16),transparent 65%)';
blobB.style.cssText += 'border-radius:50%;background:radial-gradient(circle,rgba(63,214,255,.16),transparent 65%)';
const bgDust = dust(bg, 36, 99, '#bff58a');
const drawBg = (t) => {
  grid.style.backgroundPosition = `${t * 24}px ${t * 36}px`;
  tf(blobA, { x: 200 + Math.sin(t * 0.3) * 300, y: -200 + Math.cos(t * 0.25) * 150 });
  tf(blobB, { x: 1100 + Math.cos(t * 0.27) * 250, y: 400 + Math.sin(t * 0.33) * 160 });
  bgDust(t);
};

const sceneLayer = $('div', '', stage); sceneLayer.style.inset = '0';

// --- scenes ----------------------------------------------------------------------------------------
const scenes = [];
function scene(id, build) {
  const s = S[id];
  const el = $('div', 'scene', sceneLayer);
  const w = (word, n = 0) => {
    const lw = word.toLowerCase(), list = s.words;
    let hits = list.filter((x) => x.w.toLowerCase().replace(/[^a-z0-9-]/g, '') === lw);
    if (!hits.length) hits = list.filter((x) => x.w.toLowerCase().startsWith(lw));
    if (!hits.length) throw new Error(`${id}: no word "${word}"`);
    return hits[Math.min(n, hits.length - 1)].t;
  };
  const cue = (t, name, vol = 1, args) => cues.push({ t: +(s.start + t).toFixed(3), name, vol, args });
  scenes.push({ ...s, el, draw: build(el, w, cue, s) });
}

// 1. Logo slam ------------------------------------------------------------------------------------
scene('intro', (el, w, cue, s) => {
  const rays = box($('div', 'rays', el), 960 - 900, 380 - 900, 1800, 1800);
  const rings = [0, 1, 2].map(() => box($('div', 'ring', el), 960 - 200, 380 - 200, 400, 400));
  const logo = img('/brand/logo-512.png', '', el); box(logo, 960 - 150, 230, 300, 300);
  const word = $('div', '', el); box(word, 0, 560, 1920, 260);
  word.style.cssText += 'display:flex;justify-content:center;gap:4px;';
  const letters = [...'HOODLOX'].map((c) => { const l = $('div', 'display grad', word, c); l.style.cssText += 'position:relative;font-size:250px;filter:drop-shadow(0 14px 0 rgba(0,0,0,.35));'; return l; });
  const tag = $('div', '', el); box(tag, 0, 845, 1920, 110); tag.style.cssText += 'display:flex;justify-content:center;gap:28px;';
  const tags = ['DIG.', 'OPEN.', 'EARN.'].map((t, i) => { const e = $('div', 'sticker' + ['', ' cyan', ' gold'][i], tag, t); e.style.cssText += 'position:relative;font-size:64px;'; return e; });
  const coinsA = burst(el, 34, 960, 380, 5, { spread: 2200, up: 1700 });
  const coinsB = burst(el, 26, 960, 700, 11, { spread: 2600, up: 1500 });
  const T = 2.0, hood = w('Hoodlox');
  const tagAt = [hood + 0.45, hood + 0.7, hood + 0.95];
  cue(0.15, 'riser', 0.7, [1.85]); cue(T, 'boom', 1); cue(T, 'sparkle', 0.5);
  letters.forEach((_, i) => cue(T + 0.18 + i * 0.07, 'pop', 0.45, [1 + i * 0.08]));
  cue(hood, 'whoosh', 0.5); cue(hood + 0.05, 'kaching', 0.55);
  tagAt.forEach((t, i) => cue(t, 'stamp', 0.8));
  return (lt) => {
    const pre = clamp(lt / T);
    tf(rays, { r: lt * 25, s: lt < T ? 0.2 : 1, o: lt < T ? 0 : 0.6 * clamp((lt - T) / 0.3) });
    rings.forEach((r, i) => { const k = lt - T - i * 0.12; tf(r, { s: 0.3 + Math.max(0, k) * 5, o: k < 0 ? 0 : clamp(1 - k / 0.7) }); });
    if (lt < T) tf(logo, { s: 0.15 + pre * 0.25, r: pre * 720, o: pre * 0.8, y: 120 * (1 - pre) });
    else pop(logo, lt, T, { from: 0.4 });
    const pulse = lt > hood ? 1 + 0.08 * Math.exp(-(lt - hood) * 6) * Math.sin((lt - hood) * 30) : 1;
    word.style.transform = `scale(${pulse})`;
    letters.forEach((l, i) => { const k = lt - (T + 0.18 + i * 0.07); tf(l, { y: k <= 0 ? -900 : -900 * (1 - spring(k)), r: k <= 0 ? -20 : -20 * (1 - spring(k)), o: k <= 0 ? 0 : 1 }); });
    tags.forEach((e, i) => stamp(e, lt, tagAt[i], [-4, 2, -2][i]));
    coinsA(lt - T); coinsB(lt - tagAt[2]);
  };
});

// 2. The valley -----------------------------------------------------------------------------------
scene('world', (el, w, cue, s) => {
  const a = img(SHOT('world-crowd'), 'full', el), b = img(SHOT('world-high'), 'full', el);
  const shade = $('div', 'shade', el); shade.style.background = 'linear-gradient(90deg, rgba(8,10,24,.88) 0%, rgba(8,10,24,.55) 38%, transparent 62%), linear-gradient(0deg, rgba(8,10,24,.7), transparent 30%)';
  const chain = box($('div', 'chip', el, '<i></i>ROBINHOOD CHAIN · EVM 4663'), 110, 170);
  const t1 = box($('div', 'display', el, 'One shared'), 110, 250); t1.style.fontSize = '150px';
  const t2 = box($('div', 'display grad', el, '3D valley'), 110, 395); t2.style.fontSize = '170px';
  const chips = [['together', 'MULTIPLAYER'], ['live', 'LIVE'], ['browser', 'IN YOUR BROWSER'], ['desktop', 'DESKTOP'], ['mobile', 'MOBILE']];
  const chipEls = chips.map(([, t], i) => box($('div', 'chip', el, `<i></i>${t}`), 110 + (i % 3) * 0 , 600 + i * 0));
  // Lay chips out in two rows.
  const pos = [[110, 610], [430, 610], [640, 610], [110, 700], [370, 700]];
  chipEls.forEach((c, i) => box(c, ...pos[i]));
  const phone = box($('div', 'frame', el), 1460, 1100, 330, 700); phone.style.borderRadius = '48px'; phone.style.border = '10px solid #1b2033';
  img('/video/shots/phone.png', '', phone);
  const at = chips.map(([word]) => w(word));
  cue(w('Robinhood'), 'pop', 0.5); cue(w('One'), 'stamp', 0.7); cue(w('3D') + 0.05, 'whoosh', 0.4);
  at.forEach((t) => cue(t, 'pop', 0.45, [1.2]));
  cue(w('mobile') - 0.2, 'swish', 0.5);
  const swap = w('where');
  return (lt) => {
    kb(a, lt, s.dur, { s0: 1.18, s1: 1.04, x0: 60, x1: -40 });
    kb(b, lt - swap, s.dur - swap, { s0: 1.12, s1: 1.0, x0: -30, x1: 30 }); b.style.opacity = prog(lt, swap, 0.6);
    pop(chain, lt, w('Robinhood'), { from: 0.5 });
    stamp(t1, lt, w('One'), -2); slide(t2, lt, w('3D') - 0.1, -120, 0, 0.45);
    chipEls.forEach((c, i) => pop(c, lt, at[i], { from: 0.3 }));
    const pk = lt - (w('mobile') - 0.2); tf(phone, { y: pk <= 0 ? 0 : -830 * spring(pk * 0.8), r: 6 - 4 * clamp(pk), o: pk > 0 ? 1 : 0 });
  };
});

// 3. Getting started ------------------------------------------------------------------------------
scene('gate', (el, w, cue) => {
  const ey = box($('div', 'eyebrow', el, 'Get started'), 110, 190);
  const t = box($('div', 'display', el, 'In <span class="grad">seconds</span>'), 110, 240); t.style.fontSize = '140px';
  const steps = [['Pick', 'Pick your hero'], ['give', 'Name your hunter'], ['paste', 'Paste your wallet address']].map(([word, txt], i) => {
    const row = box($('div', '', el), 110, 450 + i * 130, 640, 104);
    const n = box($('div', 'display', row, String(i + 1)), 0, 0, 104, 104);

// --- wipes between scenes ---------------------------------------------------------------------------
const wipe = $('div', '', stage); box(wipe, -500, -100, 2900, 1280);
const WIPE_COLORS = [['var(--lime)', 'var(--cyan)'], ['var(--cyan)', 'var(--purple)'], ['var(--gold)', 'var(--lime)'], ['var(--purple)', 'var(--cyan)']];
const bands = [0, 1, 2].map((i) => box($('div', '', wipe), i * 180, 0, 2900 - i * 360, 1280));
const boundaries = TL.scenes.slice(1).map((s) => s.start);
boundaries.forEach((b) => cues.push({ t: +(b - 0.3).toFixed(3), name: 'whoosh', vol: 0.55, args: [0.55] }));
const drawWipe = (t) => {
  const i = boundaries.findIndex((b) => Math.abs(t - b) < 0.33);
  if (i < 0) { wipe.style.display = 'none'; return; }
  wipe.style.display = 'block';
  const [c1, c2] = WIPE_COLORS[i % WIPE_COLORS.length];
  bands[0].style.background = c1; bands[1].style.background = c2; bands[2].style.background = '#0b0f20';
  const p = E.inOut(clamp((t - boundaries[i] + 0.33) / 0.66)), dir = i % 2 ? -1 : 1;
  wipe.style.transform = `translateX(${dir * lerp(-3400, 3400, p)}px) skewX(-18deg)`;
};

// --- captions ---------------------------------------------------------------------------------------
const cap = $('div', '', stage); cap.id = 'cap';
const chunks = [];
for (const s of TL.scenes) {
  let cur = [];
  s.words.forEach((x, i) => {
    const g = { w: x.w, t: s.start + x.t, e: s.start + x.t + x.d };
    const prev = cur[cur.length - 1];
    if (cur.length && (cur.length >= 7 || g.t - prev.e > 0.32)) { chunks.push(cur); cur = []; }
    cur.push(g);
  });
  if (cur.length) chunks.push(cur);
}
const CAP_FIX = { Hoodle: '$HOODL', Eth: 'ETH', hoodlox: 'hoodlox', dot: '.', fun: 'fun' };
let capNow = null;
const drawCap = (t) => {
  const c = chunks.find((ch, i) => t >= ch[0].t - 0.12 && t < (chunks[i + 1]?.[0].t - 0.12 ?? Infinity) && t < ch[ch.length - 1].e + 0.5);
  if (c !== capNow) {
    capNow = c;
    cap.innerHTML = c ? `<span class="box">${c.map((g) => `<em>${CAP_FIX[g.w] ?? g.w}</em>`).join(' ').replace(/<\/em> <em>\.<\/em> <em>/g, '</em><em>.</em><em>')}</span>` : '';
  }
  if (c) [...cap.querySelectorAll('em')].forEach((e, i) => { const g = c[Math.min(i, c.length - 1)]; e.className = t >= g.e ? 'on' : t >= g.t ? 'now' : ''; });
};

// --- render ---------------------------------------------------------------------------------------
window.__total = TL.total;
window.__cues = cues.sort((a, b) => a.t - b.t);
window.__voice = TL.scenes.filter((s) => s.file).map((s) => ({ file: s.file, at: s.start + s.vo }));
window.__render = (t) => {
  drawBg(t);
  for (const s of scenes) {
    const lt = t - s.start, on = lt >= 0 && lt < s.dur;
    s.el.style.display = on ? 'block' : 'none';
    if (on) s.draw(lt);
  }
  drawWipe(t);
  drawCap(t);
};
await document.fonts.ready;
await Promise.all([...document.images].map((i) => (i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))));
window.__render(+(new URLSearchParams(location.search).get('t') ?? 0));
window.__ready = true;
</script>
