<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Hoodlox</title>
  <link rel="icon" type="image/png" href="/brand/logo-64.png" />
  <link rel="apple-touch-icon" href="/brand/logo-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #15171c; --panel: #1f2229; --panel-2: #262a33; --line: #343946;
      --text: #eceef3; --muted: #9aa1b3; --gold: #a6f25d; --gold-dim: #4f7a2a;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; } /* panels set their own display, which would otherwise win */
    html, body { margin: 0; height: 100%; background: #1a1d2a; overflow: hidden; }
    body { font: 14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; color: var(--text); }
    /* Same type system as the landing page. */
    .display, .gate h1, .gate h2, .panel__head b, .modal h2, .tool__info b, .me__name, .shop__balance { font-family: 'Anton', Impact, sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: .01em; }
    .mono, .hud__stats, .me__grid dd, .row__num, .dig__label, .tool__info span, .balances, .history b, .found__tag, .gate p, .field { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    .brand__logo { width: 30px; height: 30px; flex: none; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
    .hud__brand { color: var(--text); text-decoration: none; }
    .gate__brand small em { font-style: normal; color: var(--gold); }
    .panel__head b { font-size: 20px; }
    .tool__info b { font-size: 18px; }
    .me__name { font-size: 22px; }
    .modal h2 { font-size: 30px; line-height: 1; }
    canvas { display: block; touch-action: none; }
    button { font: inherit; cursor: pointer; }
    #info { position: fixed; top: 10px; left: 12px; font-size: 13px; color: #fff;
      background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 8px; pointer-events: none; }

    /* --- gate (wallet → agent) ----------------------------------------------------------------- */
    .gate { position: fixed; z-index: 40; inset: 0; display: grid; place-items: center; padding: 20px;
      background: radial-gradient(120% 90% at 50% 0%, rgba(26,29,42,.55) 0%, rgba(14,15,20,.92) 70%); backdrop-filter: blur(6px); }
    .gate__card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 22px 24px 24px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
    .gate__brand { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .gate__brand small { margin-left: auto; color: var(--muted); }
    .gate__dot, .hud__dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(166,242,93,.18); }
    .gate h1 { font-size: 64px; line-height: .92; margin: 10px 0 14px; }
    .gate h2 { font-size: 26px; margin: 4px 0 12px; }
    .gate p { color: var(--muted); margin: 0 0 16px; }
    .gate__who { font-size: 13px; }
    .gate__err { color: #ff8a80 !important; margin-top: 10px !important; }
    .btn { display: block; width: 100%; padding: 12px 16px; margin-top: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-weight: 600; }
    .btn--primary { background: var(--gold); border-color: var(--gold); color: #10200a; }
    .btn--primary:disabled { background: var(--gold-dim); border-color: var(--gold-dim); color: #c6e3a6; cursor: wait; }
    .btn--ghost { background: transparent; color: var(--muted); }
    .btn:hover:not(:disabled) { filter: brightness(1.08); }
    .heroes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    /* Picker cards share cards.css with the landing; here they are small and lift when chosen. */
    .hero { --name: 26px; aspect-ratio: 3 / 4; padding: 0; border: 0; border-radius: 20px; font: inherit; cursor: pointer;
      transition: transform .2s cubic-bezier(.2,.9,.3,1.2), box-shadow .2s ease, filter .2s ease; filter: saturate(.7) brightness(.85); }
    .hero:hover { filter: none; }
    .hero.is-on { filter: none; transform: translateY(-6px); box-shadow: 0 0 0 3px var(--gold), 0 20px 40px rgba(0,0,0,.5); }
    .hero.card img { width: 100%; bottom: -8%; } /* .card img in cards.css loads later, so match its weight + 1 */
    .hero .card__rate { font-size: 11px; padding: 3px 8px 3px 4px; } .hero .card__rate i { width: 15px; height: 15px; }
    .hero .card__side { font-size: 9px; left: 12px; top: 12px; } .hero .card__name { left: 12px; top: 25px; }
    @media (prefers-reduced-motion: reduce) { .hero { transition: none; } }
    .field { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
    .field input { padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; font-size: 15px; }
    .field input:focus { outline: 2px solid var(--gold); outline-offset: 0; }
    .field input.is-bad { border-color: #ff8a80; }
    @media (max-width: 480px) { .gate h1 { font-size: 44px; } .hero { --name: 20px; } .hero .card__rate { display: none; } .gate__card { padding: 18px; } }
    .gate__card { max-height: calc(100dvh - 40px); overflow: auto; }

    /* --- HUD -------------------------------------------------------------------------------------- */
    .hud { position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 14px;
      background: linear-gradient(180deg, rgba(15,16,22,.9), rgba(15,16,22,0)); pointer-events: none; }
    .hud > * { pointer-events: auto; }
    .hud__brand { display: flex; align-items: center; gap: 8px; }
    .hud__stats { display: flex; gap: 20px; margin-left: 8px; }
    .hud__stats div { display: flex; flex-direction: column; line-height: 1.25; }
    .hud__stats span { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .hud__stats b { font-size: 13px; font-variant-numeric: tabular-nums; }
    .hud__actions { margin-left: auto; display: flex; gap: 8px; }
    .icon-btn { height: 36px; min-width: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 10px;
      border: 1px solid var(--line); border-radius: 10px; background: rgba(31,34,41,.9); color: var(--text); }
    .icon-btn--me { background: var(--gold); border-color: var(--gold); color: #10200a; font-weight: 600; max-width: 180px; }
    @media (max-width: 900px) { .hud__dashLabel { display: none; } }
    .icon-btn--me span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    @media (max-width: 700px) { .hud__stats div:nth-child(3), .hud__brand b { display: none; } .hud__stats { gap: 12px; } }

    .panel { position: fixed; z-index: 30; top: 64px; right: 12px; width: min(380px, calc(100% - 24px)); max-height: calc(100% - 80px);
      display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.45); overflow: hidden; }
    .panel__head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); }
    .panel__close { width: 30px; height: 30px; border: 0; border-radius: 8px; background: var(--panel-2); color: var(--text); font-size: 18px; }
    .board__list { margin: 0; padding: 6px; list-style: none; overflow: auto; }
    .row { display: grid; grid-template-columns: 28px 36px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
    .row.is-me { background: #1d2817; outline: 1px solid var(--gold-dim); }
    .row__rank { color: var(--muted); text-align: center; }
    /* Face crop of the full-body portrait, on the hunter's card colour (like the landing avatar). */
    .row__portrait, .me__portrait { background: var(--p) 50% 16% / 210% no-repeat, var(--c, #30343f); }
    .row__portrait { width: 36px; height: 36px; border-radius: 9px; }
    .row__who, .row__num { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
    .row__who span, .row__num span { font-size: 11px; color: var(--muted); }
    .row__who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row__num { text-align: right; font-variant-numeric: tabular-nums; }
    .me__top { display: flex; gap: 12px; align-items: center; padding: 14px 14px 6px; }
    .me__top div { display: flex; flex-direction: column; line-height: 1.3; }
    .me__top span { font-size: 12px; color: var(--muted); }
    .me__portrait { width: 56px; height: 56px; border-radius: 14px; flex: none; }
    .me__grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; padding: 8px 14px; }
    .me__grid div { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; }
    .me__grid dt { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .me__grid dd { margin: 2px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; }
    .me__note { margin: 4px 14px 14px; font-size: 11px; color: var(--muted); }

    .icon-btn { position: relative; }
    .badge { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--gold); color: #10200a; font: 700 11px/18px system-ui, sans-serif; font-style: normal; text-align: center; }
    .btn--small { width: auto; margin: 0; padding: 7px 12px; font-size: 13px; }
    .btn:disabled { opacity: .55; cursor: default; }
    .muted { color: var(--muted); }

    /* shop */
    .shop__balance { margin: 10px 14px 4px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .shop__list, .chests, .balances, .history { list-style: none; margin: 0; padding: 6px 10px; overflow: auto; }
    .tool { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; background: var(--panel-2); margin-bottom: 8px; border: 1px solid transparent; }
    .tool.is-on { border-color: var(--gold-dim); }
    .tool__icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: #30343f; }
    .tool__icon--pickaxe { background: #2f3a46; } .tool__icon--drill { background: #26331a; }
    .tool__info { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
    .tool__info span { font-size: 12px; color: var(--muted); }
    .tool__price { color: var(--gold) !important; font-variant-numeric: tabular-nums; }

    /* inventory */
    .tabs { display: flex; gap: 6px; padding: 10px 14px 4px; }
    .tab { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font-weight: 600; }
    .tab.is-on { color: #10200a; background: var(--gold); border-color: var(--gold); }
    .bag__chests, .bag__rewards { display: flex; flex-direction: column; min-height: 0; overflow: auto; }
    .chests { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .chest { display: grid; justify-items: center; gap: 4px; padding: 8px 6px 10px; border-radius: 12px; background: var(--panel-2); border: 1px solid color-mix(in srgb, var(--r) 45%, transparent); }
    .chest img { width: 100%; aspect-ratio: 1; object-fit: contain; }
    .chest b { font-size: 12px; color: var(--r); }
    .bag__empty { margin: 8px 14px 14px; font-size: 13px; color: var(--muted); }
    .balances { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .balances li { background: var(--panel-2); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
    .balances li span { font-size: 11px; color: var(--muted); }
    .history li { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 6px 2px; font-size: 13px; border-bottom: 1px solid var(--line); }
    .history img { width: 34px; height: 34px; object-fit: contain; }
    .history b { font-variant-numeric: tabular-nums; }

    .toast { position: fixed; z-index: 60; left: 50%; top: 70px; transform: translateX(-50%); max-width: min(440px, calc(100% - 24px));
      padding: 10px 16px; border-radius: 12px; background: rgba(15,16,22,.94); border: 1px solid var(--line); color: var(--text); font-size: 13px; text-align: center; }

    /* found / reveal modals */
    .modal { position: fixed; z-index: 50; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(8,9,12,.6); backdrop-filter: blur(3px); }
    .modal__card { width: min(380px, 100%); text-align: center; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px 20px;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--r) 30%, transparent), 0 30px 80px rgba(0,0,0,.55); animation: pop .35s cubic-bezier(.2,1.4,.4,1); }
    .modal__card img { display: block; margin: 0 auto; width: 200px; height: 200px; object-fit: contain; filter: drop-shadow(0 10px 24px color-mix(in srgb, var(--r) 45%, transparent)); }
    .found__tag { display: inline-block; margin: 2px 0 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em;
      color: var(--r); background: color-mix(in srgb, var(--r) 16%, transparent); }
    .modal h2 { margin: 2px 0 6px; font-size: 22px; }
    .modal p { margin: 0 0 6px; color: var(--muted); }
    .modal__actions { display: flex; gap: 8px; margin-top: 12px; }
    .modal__actions .btn { margin: 0; }
    .reveal__stage img { animation: shake .55s ease-in-out 2; }
    .reveal.is-open .reveal__stage img { animation: pop .4s cubic-bezier(.2,1.5,.4,1); }
    .reveal__title { font-variant-numeric: tabular-nums; }
    .reveal__usd { font-weight: 600; color: var(--gold) !important; min-height: 1.4em; }
    @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) { .modal__card, .reveal__stage img { animation: none !important; } }

    /* dig prompt + progress */
    #dig { position: fixed; z-index: 21; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: grid; justify-items: center; gap: 8px; pointer-events: none; }
    #dig > * { pointer-events: auto; }
    .dig__btn { padding: 12px 20px; border: 0; border-radius: 999px; background: var(--gold); color: #10200a; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
    .dig__btn:disabled { background: rgba(15,16,22,.82); color: var(--muted); font-weight: 600; cursor: not-allowed; }
    .dig__bar { width: min(340px, 80vw); padding: 10px 12px; border-radius: 14px; background: rgba(15,16,22,.82); backdrop-filter: blur(4px); }
    .dig__label { font-size: 13px; margin-bottom: 6px; font-variant-numeric: tabular-nums; text-align: center; }
    .dig__track { height: 8px; border-radius: 4px; background: #343946; overflow: hidden; }
    .dig__fill { height: 100%; width: 0; background: var(--gold); }
    .dig__cancel { padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; background: rgba(15,16,22,.82); color: var(--text); font-size: 12px; }
    body.gated #dig { display: none; }

    /* --- movement controls ----------------------------------------------------------------------- */
    #ctl { position: fixed; z-index: 20; inset: 0; pointer-events: none; }
    #ctl button { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
      width: 64px; height: 64px; border: 0; border-radius: 16px; color: #fff; font-size: 22px; background: rgba(0,0,0,.4); backdrop-filter: blur(4px); }
    #ctl button:active, #ctl button.on { background: rgba(255,255,255,.45); color: #111; }
    #view { position: fixed; top: 64px; right: 12px; width: auto !important; height: 34px !important; padding: 0 12px; font-size: 13px !important; font-weight: 600; }
    body.gated #ctl, body.gated #info { display: none; }
    #hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 12px; opacity: .75; white-space: nowrap; }
    .pad { display: none; position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); gap: 10px; }
    #pad-move { left: 20px; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(2, 64px); }
    #pad-move #f { grid-column: 2; } #pad-move #l { grid-column: 1; grid-row: 2; } #pad-move #b { grid-column: 2; grid-row: 2; } #pad-move #r { grid-column: 3; grid-row: 2; }
    #pad-act { right: 20px; flex-direction: column; }
    body.touch .pad { display: flex; }
    body.touch #pad-move { display: grid; }
    body.touch #hint { display: none; }
  </style>
</head>
<body>
  <div id="info">loading…</div>
  <div id="dig">
    <button class="dig__btn" type="button" hidden>Dig here</button>
    <div class="dig__bar" hidden><div class="dig__label"></div><div class="dig__track"><div class="dig__fill"></div></div></div>
    <button class="dig__cancel" type="button" hidden>Cancel (Esc)</button>
  </div>
  <div id="ctl">
    <button id="view" type="button">3rd person</button>
    <div id="hint">WASD gerak · Shift lari · Spasi lompat · E gali · H dashboard · M suara · V ganti kamera · drag untuk melihat</div>
    <div id="pad-move" class="pad">
      <button id="f" type="button" data-dir="f">▲</button>
      <button id="l" type="button" data-dir="l">◀</button>
      <button id="b" type="button" data-dir="b">▼</button>
      <button id="r" type="button" data-dir="r">▶</button>
    </div>
    <div id="pad-act" class="pad">
      <button id="run" type="button">🏃</button>
      <button id="jump" type="button">⤒</button>
    </div>
  </div>
  <script type="module" src="/src/map.js"></script>
</body>
</html>
